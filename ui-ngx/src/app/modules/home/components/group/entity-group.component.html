<div class="mat-padding flex flex-col">
  <form [formGroup]="entityForm">
    <fieldset [disabled]="(isLoading$ | async) || !isEdit">
      <mat-form-field class="mat-block">
        <mat-label translate>entityGroup.name</mat-label>
        <input matInput formControlName="name" required/>
        <mat-error *ngIf="entityForm.get('name').hasError('required')">
          {{ 'entityGroup.name-required' | translate }}
        </mat-error>
        <mat-error *ngIf="entityForm.get('name').hasError('maxlength')">
          {{ 'entityGroup.name-max-length' | translate }}
        </mat-error>
      </mat-form-field>
      <div formGroupName="additionalInfo" class="flex flex-col">
        <mat-form-field class="mat-block">
          <mat-label translate>entityGroup.description</mat-label>
          <textarea matInput formControlName="description" rows="2"></textarea>
        </mat-form-field>
      </div>
      <mat-checkbox formControlName="publicGroup">
        {{ 'entityGroup.public' | translate }}
      </mat-checkbox>
    </fieldset>
  </form>
</div>
