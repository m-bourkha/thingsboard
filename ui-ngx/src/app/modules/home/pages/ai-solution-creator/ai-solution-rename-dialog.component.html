<form [formGroup]="renameForm" (ngSubmit)="rename()">
  <mat-toolbar color="primary">
    <h2 translate>ai-solution-creator.rename</h2>
    <span class="flex-1"></span>
    <button mat-icon-button type="button" (click)="cancel()">
      <mat-icon class="material-icons">close</mat-icon>
    </button>
  </mat-toolbar>

  <div mat-dialog-content>
    <mat-form-field class="mat-block" appearance="outline">
      <mat-label translate>ai-solution-creator.name</mat-label>
      <input matInput formControlName="name" required cdkFocusInitial>
      @if (renameForm.get('name').hasError('required')) {
        <mat-error translate>ai-solution-creator.name-required</mat-error>
      }
    </mat-form-field>
  </div>

  <div mat-dialog-actions class="flex justify-end">
    <button mat-button type="button" (click)="cancel()">
      <span translate>action.cancel</span>
    </button>
    <button mat-raised-button color="primary" type="submit" [disabled]="renameForm.invalid">
      <span translate>action.save</span>
    </button>
  </div>
</form>
